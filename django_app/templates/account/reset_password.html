{% extends "account/base.html" %}
{% block title %}Reset Password | {{ sitename }}{% endblock %}
{% block content %}
  <section class="panel" style="max-width: 38rem;">
    <div class="eyebrow">Recovery</div>
    <h2>Reset Password</h2>
    <p class="muted">We’ll email a reset link if the address matches an existing account.</p>
    <form method="post">
      {% csrf_token %}
      {% include "account/_form_fields.html" %}
      <button type="submit">Send instructions</button>
    </form>
  </section>
{% endblock %}

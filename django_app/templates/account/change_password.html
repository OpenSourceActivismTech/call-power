{% extends "account/base.html" %}
{% block title %}Change Password | {{ sitename }}{% endblock %}
{% block content %}
  <section class="panel" style="max-width: 42rem;">
    <div class="eyebrow">Account</div>
    <h2>Change Password{% if legacy_user_record %} for {{ legacy_user_record.name }}{% endif %}</h2>
    <form method="post">
      {% csrf_token %}
      {% include "account/_form_fields.html" %}
      <button type="submit">Save</button>
    </form>
  </section>
{% endblock %}
